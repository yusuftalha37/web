<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ürün | Solar Arena Enerji</title>
  <meta name="robots" content="index, follow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ÜST BİLGİ ÇUBUĞU -->
  <div class="topbar">
    <div class="container topbar-inner">
      <span data-site="topNote">Türkiye'nin her yerine hızlı gönderim</span>
      <span class="topbar-right" id="topbarAccount"></span>
    </div>
  </div>

  <!-- BAŞLIK -->
  <header class="siteheader">
    <div class="container header-row">
      <a href="index.html" class="logo">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <span class="logo-text">Solar<span>Arena</span> <small data-site="brandTagline">Enerji Sistemleri San. Tic. Ltd. Şti.</small></span>
      </a>
      <form class="site-search" id="siteSearch" role="search">
        <input type="search" id="searchInput" placeholder="Aramak istediğiniz ürünü yazın…" autocomplete="off" aria-label="Ürün ara">
        <button type="submit" class="search-btn-text">ARA</button>
      </form>
      <div class="header-actions">
        <a href="hesap.html" class="header-action" id="headerAccount">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Üyelik</span>
        </a>
        <a href="sepet.html" class="header-action" id="cartBtn" aria-label="Sepete git">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1.6"/>
            <circle cx="19" cy="21" r="1.6"/>
            <path d="M2.5 3h3l2.6 12.5a2 2 0 0 0 2 1.5h8.7a2 2 0 0 0 2-1.6L22.5 8H6.2"/>
          </svg>
          <span>Sepetim</span>
          <span class="cart-count" id="cartCount" hidden>0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- ÜRÜN DETAYI -->
  <section class="section">
    <div class="container">
      <nav class="breadcrumb" id="pBreadcrumb"></nav>
      <div id="productDetail"></div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-bottom">
      <div class="container">
        <span data-site="footerCopyright">© 2026 Solar Arena Enerji — Bu site örnek/demo amaçlıdır.</span>
      </div>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/main.js"></script>
  <script src="js/urun.js"></script>
</body>
</html>
